name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        if: runner.os == 'Windows'
        run: npm run package

      - name: Build Linux artifacts
        if: runner.os == 'Linux'
        run: npm run package:linux

      # Signing is optional: with no certificate in secrets the build still
      # succeeds, it just produces an unsigned, un-notarized app.
      - name: Build macOS artifacts
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No CSC_LINK secret set - building macOS artifacts unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run package:mac -- -c.mac.identity=null -c.mac.notarize=false
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            npm run package:mac
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
          generate_release_notes: true
