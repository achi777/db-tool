name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you run into, not only the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like DBTool to do?
      description: Alternatives you have considered are welcome too.
    validations:
      required: true

  - type: checkboxes
    id: engines
    attributes:
      label: Which engines does this concern?
      options:
        - label: PostgreSQL
        - label: MySQL
        - label: MariaDB
        - label: SQLite
        - label: Oracle
        - label: SQL Server
        - label: Not engine-specific
